# Synology Container Manager project. Adjust the left-hand paths to your volumes.
services:
  harbor:
    build: .
    container_name: harbor-daemon
    restart: unless-stopped
    network_mode: none          # the daemon needs no network at all: SMB is the transport
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp"]
    volumes:
      - ./config/harbor.json:/etc/harbor/harbor.json:ro
      - /volume1/harbor:/harbor                        # tickets, staging, logs, state
      - /volume1/Projects:/projects                    # destination (must match approved_roots)
      # Every USB slot. DSM mounts each USB volume at /volumeUSB<n>, and n changes on replug, so the
      # whole host filesystem is mounted read-only and the daemon watches /host/volumeUSB*.
      # The container can read the other shares but cannot write to any of them.
      - type: bind
        source: /
        target: /host
        read_only: true                                # change to false ONLY to enable card clearing
        bind:
          propagation: rslave                          # so cards inserted later appear inside
      - /dev:/dev:ro                                   # volume serial lookup (blkid); DSM 7.1 has no /dev/disk
    device_cgroup_rules:                               # read (not write) access to SCSI/USB block devices
      - "b 8:* r"
      - "b 65:* r"
